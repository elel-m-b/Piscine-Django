<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>ex05 - Remove a movie</title></head>
<body>
<form method="post">
    {% csrf_token %}
    <select name="title">
        {% for movie in movies %}
        <option value="{{ movie.title }}">{{ movie.title }}</option>
        {% endfor %}
    </select>
    <button type="submit" name="remove">remove</button>
</form>
</body>
</html>
