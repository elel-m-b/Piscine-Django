<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>ex05 - Movies</title></head>
<body>
<table border="1">
    <tr>
        <th>Episode</th>
        <th>Title</th>
        <th>Opening crawl</th>
        <th>Director</th>
        <th>Producer</th>
        <th>Release date</th>
    </tr>
    {% for movie in movies %}
    <tr>
        <td>{{ movie.episode_nb }}</td>
        <td>{{ movie.title }}</td>
        <td>{{ movie.opening_crawl|default_if_none:"" }}</td>
        <td>{{ movie.director }}</td>
        <td>{{ movie.producer }}</td>
        <td>{{ movie.release_date }}</td>
    </tr>
    {% endfor %}
</table>
</body>
</html>
