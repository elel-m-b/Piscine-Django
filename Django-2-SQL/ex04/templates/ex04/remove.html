<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>ex04 - Remove a movie</title></head>
<body>
<form method="post">
    {% csrf_token %}
    <select name="title">
        {% for title in titles %}
        <option value="{{ title }}">{{ title }}</option>
        {% endfor %}
    </select>
    <button type="submit" name="remove">remove</button>
</form>
</body>
</html>
