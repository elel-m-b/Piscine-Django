<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>ex08 - Windy homeworlds</title></head>
<body>
<table border="1">
    <tr>
        <th>Name</th>
        <th>Homeworld</th>
        <th>Climate</th>

</table>
</body>
</html>
