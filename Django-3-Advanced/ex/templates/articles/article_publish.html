{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block title %}Publish - Hellenica{% endblock %}

{% block content %}
    <h1>Publish a new article</h1>
    <form method="post" novalidate>
        {% csrf_token %}
        {% bootstrap_form form %}
        {% bootstrap_button "Publish" button_type="submit" button_class="btn btn-primary" %}
    </form>
{% endblock %}
